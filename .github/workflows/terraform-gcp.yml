name: Terraform GCP (infra + API)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply despliega todo; destroy elimina la infraestructura"
        type: choice
        options: [apply, destroy]
        default: apply
      stable_ref:
        description: "Ref de git que queda como stable (100% del tráfico, sin canary)"
        type: string
        default: v3.1.0

concurrency:
  group: terraform-gcp
  cancel-in-progress: false

env:
  PROJECT_ID: project-39d0c894-3885-4211-89d
  REGION: us-central1
  TF_VAR_project_id: project-39d0c894-3885-4211-89d
  TF_STATE_BUCKET: project-39d0c894-3885-4211-89d-hospitaline-tfstate
  ACTION: ${{ inputs.action }}
  STABLE_REF: ${{ inputs.stable_ref }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create the Terraform state bucket if missing
        run: |
          gcloud services enable cloudresourcemanager.googleapis.com serviceusage.googleapis.com --project "$PROJECT_ID"
          gcloud storage buckets describe "gs://$TF_STATE_BUCKET" >/dev/null 2>&1 || \
            gcloud storage buckets create "gs://$TF_STATE_BUCKET" --project "$PROJECT_ID" \
              --location "$REGION" --uniform-bucket-level-access

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Create the registry and the database first
        if: env.ACTION == 'apply'
        run: |
          terraform apply -input=false -auto-approve \
            -target=google_artifact_registry_repository.api \
            -target=google_sql_database.app \
            -target=google_sql_user.app

      - name: Publish the stable image by digest
        if: env.ACTION == 'apply'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          read -r VERSION IMAGE < <(../scripts/canary/publish-image.sh "$STABLE_REF")
          echo "TF_VAR_stable_version=$VERSION" >> "$GITHUB_ENV"
          echo "TF_VAR_stable_image=$IMAGE" >> "$GITHUB_ENV"

      - name: Run database migrations
        if: env.ACTION == 'apply'
        run: ./scripts/migrate.sh

      - name: Deploy Memorystore, Cloud Run and the rest
        if: env.ACTION == 'apply'
        run: terraform apply -input=false -auto-approve

      - name: Smoke test the public URL
        if: env.ACTION == 'apply'
        run: |
          URL="$(terraform output -raw api_url)"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -D - -o /dev/null "$URL/health" \
            | grep -i "x-app-version: $TF_VAR_stable_version; track=stable"
          echo "### Stable $TF_VAR_stable_version desplegada: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        if: env.ACTION == 'destroy'
        run: terraform destroy -input=false -auto-approve
