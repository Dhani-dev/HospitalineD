apiVersion: v1
kind: Service
metadata:
  name: hospitaline-api
  namespace: hospitaline-prod
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  # IP reservada en terraform/gke (hospitaline-gke-api-ip): la URL de los compañeros no cambia.
  loadBalancerIP: "34.121.168.216"
  selector:
    app: hospitaline-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
