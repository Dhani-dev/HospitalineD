apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hospitaline-redis
  namespace: hospitaline-prod
spec:
  podSelector:
    matchLabels:
      app: hospitaline-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hospitaline-api
      ports:
        - protocol: TCP
          port: 6379
  egress: []
