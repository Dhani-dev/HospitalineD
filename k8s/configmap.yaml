apiVersion: v1
kind: ConfigMap
metadata:
  name: hospitaline-config
  namespace: hospitaline-prod
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_TTL_SECONDS: "60"
  PEER_CACHE_TTL_SECONDS: "30"
  # Phol (biblio-express, Azure). Vacío = peer con live: false.
  USERS_API_URL: ""
  USERS_LAST_PATH: "/api/v2/users/last"
  USERS_LIST_PATH: "/api/users"
  # Neithan (Pokenetes, AWS). Vacío = peer con live: false.
  ENTRENADOR_API_URL: ""
  ENTRENADOR_LAST_PATH: "/api/v2/entrenador/last"
  ENTRENADOR_LIST_PATH: "/entrenador"
  OTEL_SERVICE_NAME: "hospitaline-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-us-east-3.grafana.net/otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  ORCHESTRATOR_API_URL: ""
