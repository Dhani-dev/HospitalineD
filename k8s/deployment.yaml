apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospitaline-api
  namespace: hospitaline-prod
spec:
  replicas: 2

  # Durante un rollout nunca baja de 2 réplicas listas.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: hospitaline-api

  template:
    metadata:
      labels:
        app: hospitaline-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: hospitaline-api

      containers:

        # Hospitaline API
        - name: hospitaline-api
          image: us-central1-docker.pkg.dev/project-39d0c894-3885-4211-89d/hospitaline-repo/hospitaline-api:v5.0.2
          
          ports:
            - containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: hospitaline-config

          env:
            - name: DB_HOST
              value: "127.0.0.1"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: hospitaline-db
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hospitaline-db
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospitaline-db
                  key: DB_PASSWORD

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hospitaline-otel
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true

            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: hospitaline-otel
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true

            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hospitaline-chaos
                  key: CHAOS_TOKEN
                  optional: true

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

        # Cloud SQL Auth Proxy
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4

          args:
            - "--structured-logs"
            - "--port=5432"
            - "project-39d0c894-3885-4211-89d:us-central1:hospitaline-db"

          securityContext:
            runAsNonRoot: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"