# Grafana k8s-monitoring on GKE Autopilot.
# Password is NOT stored here. Pass it with:
#   --set-string destinations.grafana-cloud-metrics.auth.password="$GRAFANA_CLOUD_TOKEN"

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push
    disabled: false
    auth:
      type: basic
      username: "3605358"

clusterMetrics:
  enabled: true
  collector: alloy

collectorCommon:
  alloy:
    remoteConfig:
      extraAttributes:
        environment: production
        cloud: gcp
        service-discovery: "true"

collectors:
  alloy:
    presets: [clustered, statefulset]
    extraConfig: ""

telemetryServices:
  node-exporter:
    deploy: false
  kube-state-metrics:
    deploy: true
  beyla:
    deploy: false
  opencost:
    deploy: false
  sdkInjector:
    deploy: false
